[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qbotui"
version = "0.1.0"
description = "Windows viewer for the QBot Platform hardware quick-start probe streams."
requires-python = ">=3.11,<3.15"
dependencies = [
    "PySide6>=6.6",
    "opencv-python-headless>=4.8",
    "numpy>=1.26",
]

[project.scripts]
qbotui = "qbotui.__main__:main"

[tool.setuptools.packages.find]
include = ["qbotui*"]
